<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Website Editor — Your Energy Best</title>
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  /admin/ — the website editor.

  HOW IT'S BUILT: everything editable is listed once, in PAGES below — each
  field says which file and path it saves to, and where it shows on the site.
  The editor draws itself from that list, so a field only appears here if a
  page actually reads it. To make something new editable: wire it on the page
  (read it from content.json / options-content.json / services-content.json),
  then add one line to PAGES.

  Saving goes through save.php (admin session + CSRF token); every save keeps
  the previous version in /backups, which History can put back.
  The previous editor is at /admin/classic.html until this one has settled in.
-->
<style>
  :root { --navy:#023047; --navy2:#011627; --teal:#219EBC; --sky:#8ECAE6; --gold:#FFB703; --orange:#FB8500;
          --green:#06A77D; --red:#C0392B; --ink:#1d2b36; --soft:#5b6b77; --line:#e3e8ec; --bg:#f4f6f8; --card:#fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.5; }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--teal); }
  .hidden { display: none !important; }

  /* Login */
  .login { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
           background: linear-gradient(135deg, var(--navy2), var(--navy) 60%, #0b5f7a); }
  .login form { width: 100%; max-width: 380px; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .login h1 { margin: 0 0 4px; font-size: 1.35rem; color: var(--navy); }
  .login p { margin: 0 0 18px; color: var(--soft); font-size: .92rem; }
  .login input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 10px; }
  .login button { width: 100%; padding: 12px; border: 0; border-radius: 9px; background: var(--teal); color: #fff; font-weight: 600; }
  .login .err { color: var(--red); font-size: .9rem; min-height: 1.3em; margin: 4px 0 8px; }

  /* Shell */
  header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 20px;
               background: var(--navy); color: #fff; }
  header.top h1 { font-size: 1.05rem; margin: 0; font-weight: 600; flex: 1; }
  header.top a, header.top button { color: #fff; background: rgba(255,255,255,.1); border: 0; border-radius: 8px; padding: 7px 12px; font-size: .88rem; text-decoration: none; }
  .shell { display: grid; grid-template-columns: 220px 1fr; max-width: 1200px; margin: 0 auto; }
  nav.side { position: sticky; top: 52px; align-self: start; padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
  nav.side .grp { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); margin: 14px 10px 4px; }
  nav.side button { text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 12px; color: var(--ink); font-size: .95rem; }
  nav.side button:hover { background: #e8eef2; }
  nav.side button.on { background: var(--navy); color: #fff; }
  main { padding: 20px 20px 120px; min-width: 0; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .page-head h2 { margin: 0; font-size: 1.5rem; color: var(--navy); }
  .page-head a { font-weight: 600; text-decoration: none; }
  .intro { color: var(--soft); margin: -6px 0 16px; font-size: .95rem; }

  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    nav.side { position: sticky; top: 52px; z-index: 15; flex-direction: row; overflow-x: auto; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
    nav.side .grp { display: none; }
    nav.side button { white-space: nowrap; flex: 0 0 auto; }
    main { padding: 16px 16px 130px; }
    header.top { padding: 10px 16px; }
  }

  /* Sections */
  .sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
  .sec > .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .sec > .hd h3 { margin: 0; font-size: 1.05rem; flex: 1; min-width: 180px; }
  .sec > .hd .where { font-size: .8rem; color: var(--soft); }
  .sec > .hd a.view { font-size: .85rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .sec > .bd { padding: 16px 18px; }
  .note { font-size: .88rem; color: var(--soft); background: #f6f9fb; border-left: 3px solid var(--sky); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 0 0 14px; }
  .note.warn { border-color: var(--gold); background: #fff8e8; }

  /* Fields */
  .f { margin-bottom: 14px; }
  .f:last-child { margin-bottom: 0; }
  .f > label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  .f > .help { font-size: .82rem; color: var(--soft); margin: -2px 0 6px; }
  .f input[type=text], .f input[type=url], .f input[type=number], .f input[type=date], .f textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .f textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .f input:focus, .f textarea:focus, .rich .area:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(33,158,188,.15); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row.r3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 600px) { .row, .row.r3 { grid-template-columns: 1fr; } }
  .toggle { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: .92rem; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; }
  .unit { display: flex; align-items: center; gap: 6px; } .unit input { max-width: 120px; }

  .rich { border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .rich .tb { display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid var(--line); background: #fafbfc; border-radius: 8px 8px 0 0; }
  .rich .tb button { border: 0; background: none; border-radius: 6px; padding: 4px 9px; font-size: .9rem; color: var(--ink); }
  .rich .tb button:hover { background: #e8eef2; }
  .rich .area { min-height: 90px; padding: 10px 12px; border-radius: 0 0 8px 8px; }
  .rich .area p { margin: 0 0 .6em; } .rich .area ul, .rich .area ol { margin: 0 0 .6em; padding-left: 1.3em; }
  .rich.tall .area { min-height: 260px; }

  /* Lists */
  .items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .item { border: 1px solid var(--line); border-radius: 10px; background: #fbfcfd; }
  .item > .ih { display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 14px; cursor: pointer; user-select: none; }
  .item > .ih .t { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .item > .ih .t small { color: var(--soft); font-weight: 400; margin-left: 6px; }
  .item > .ib { padding: 4px 14px 14px; border-top: 1px solid var(--line); background: #fff; border-radius: 0 0 10px 10px; }
  .item:not(.open) > .ib { display: none; }
  .ibtn { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 3px 9px; font-size: .85rem; color: var(--ink); }
  .ibtn:hover { border-color: var(--teal); }
  .ibtn.del:hover { border-color: var(--red); color: var(--red); }
  .add { border: 1px dashed var(--teal); background: #f2fafc; color: var(--teal); border-radius: 9px; padding: 9px 14px; font-weight: 600; }

  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .img { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .img .ph { aspect-ratio: 4/3; background: #eef2f5 center/cover no-repeat; }
  .img .ph.logo { background-size: contain; background-color: #fff; }
  .img input { width: 100%; border: 0; border-top: 1px solid var(--line); padding: 6px 8px; font-size: .85rem; }
  .img .ctl { display: flex; gap: 4px; padding: 6px; justify-content: flex-end; }
  .upload { display: inline-flex; align-items: center; gap: 8px; }
  .upload input { display: none; }

  /* Save bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line);
         box-shadow: 0 -6px 20px rgba(0,0,0,.06); padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar .st { flex: 1; font-size: .92rem; color: var(--soft); min-width: 180px; }
  .bar .st b { color: var(--ink); }
  .bar .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-right: 6px; }
  .bar.dirty .dot { background: var(--gold); }
  .btn { border: 0; border-radius: 9px; padding: 10px 18px; font-weight: 600; }
  .btn.pri { background: var(--teal); color: #fff; } .btn.pri:disabled { background: #b7cbd3; cursor: default; }
  .btn.sec2 { background: #eef2f5; color: var(--ink); }
  .btn.danger { background: #fdecea; color: var(--red); }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px;
           border-radius: 10px; z-index: 60; font-size: .95rem; box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; } .toast.bad { background: var(--red); }

  .modal { position: fixed; inset: 0; z-index: 70; background: rgba(1,22,39,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal .box { background: #fff; border-radius: 14px; padding: 22px; max-width: 460px; width: 100%; }
  .modal h4 { margin: 0 0 8px; font-size: 1.1rem; } .modal p { margin: 0 0 16px; color: var(--soft); }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

  /* Connections + History */
  .pill { font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 50px; background: #eee; color: #555; white-space: nowrap; }
  .pill.ok { background: #d1fae5; color: #065f46; } .pill.bad { background: #fee2e2; color: #991b1b; } .pill.warn { background: #fff4e5; color: #a15c00; }
  .steps { margin: 0 0 12px 1.2rem; padding: 0; font-size: .9rem; color: #33424d; line-height: 1.7; }
  details.how > summary { cursor: pointer; font-weight: 600; font-size: .9rem; margin-bottom: 8px; }
  .msg { margin-left: 10px; font-size: .9rem; }
  table.hist { width: 100%; border-collapse: collapse; font-size: .92rem; }
  table.hist td { padding: 8px 6px; border-top: 1px solid var(--line); }
  table.hist td:last-child { text-align: right; white-space: nowrap; }
  code { background: #eef2f5; padding: 1px 5px; border-radius: 4px; font-size: .88em; }
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm" autocomplete="on">
    <h1>Website Editor</h1>
    <p>Sign in with your lumaria account.</p>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button type="submit" id="loginBtn">Sign in</button>
  </form>
</div>

<header class="top">
  <h1>⚡ Website Editor</h1>
  <a href="/" target="_blank" rel="noopener">View site ↗</a>
  <button type="button" id="logoutBtn">Sign out</button>
</header>

<div class="shell">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="st" id="status"><span class="dot"></span>Loading…</div>
    <button class="btn sec2 hidden" id="discardBtn" type="button">Discard changes</button>
    <button class="btn pri" id="publishBtn" type="button" disabled>Publish</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   PAGES — every editable thing on the site, in the order it appears.
   file: which JSON it lives in (content | options | services)
   path: where in that file ('home.hero_subtitle', 'faq')
   type: text (one line) · para (paragraphs) · rich (bold/links/lists) · url ·
         number · date · toggle · lines (one per line → list) ·
         images · list (repeating items with their own fields)
   ═══════════════════════════════════════════════════════════════════ */
const PAGES = [
  { id: 'home', group: 'Pages', label: 'Homepage', url: '/', sections: [
    { title: 'Top of the page', anchor: '', fields: [
      { path: 'home.hero_eyebrow', type: 'text', label: 'Small label above the headline' },
      { row: [
        { path: 'home.hero_title_part1', type: 'text', label: 'Headline — white part' },
        { path: 'home.hero_title_part2', type: 'text', label: 'Headline — orange part' } ] },
      { path: 'home.hero_subtitle', type: 'para', label: 'Line under the headline' } ],
      note: 'The four buttons under it (Learn · Quote · Already have solar → lumaria app · Call) are set in the page code so they always point to the right places.' },
    { title: 'Numbers bar', fields: [
      { row3: [ { path: 'stats.savings', type: 'text', label: 'Number 1' }, { path: 'stats.savings_label', type: 'text', label: 'Label 1' } ] },
      { row3: [ { path: 'stats.hours', type: 'text', label: 'Number 2' }, { path: 'stats.hours_label', type: 'text', label: 'Label 2' } ] },
      { row3: [ { path: 'stats.installations', type: 'text', label: 'Number 3' }, { path: 'stats.installations_label', type: 'text', label: 'Label 3' } ] },
      { row3: [ { path: 'stats.customers', type: 'text', label: 'Number 4' }, { path: 'stats.customers_label', type: 'text', label: 'Label 4' } ] } ],
      note: 'The install map below counts real installs from Zoho on its own — keep "Installations" close to it.' },
    { title: 'How it works (3 steps)', anchor: 'how-it-works', fields: [
      { path: 'home.process_steps', type: 'list', fixed: true, titleKey: 'title', fields: [
        { key: 'title', type: 'text', label: 'Step name' }, { key: 'description', type: 'para', label: 'Description' } ] } ] },
    { title: 'What makes us different', anchor: 'why-yeb', fields: [
      { path: 'home.differentiators.title', type: 'text', label: 'Heading', help: 'Leave blank to keep "What Makes Us Different".' },
      { path: 'home.differentiators.subtitle', type: 'text', label: 'Line under the heading' },
      { path: 'home.differentiators.cards', type: 'list', titleKey: 'title', addLabel: 'Add a card', blank: { icon: '⭐', title: '', description: '' }, fields: [
        { row: [ { key: 'icon', type: 'text', label: 'Emoji' }, { key: 'title', type: 'text', label: 'Title' } ] },
        { key: 'description', type: 'para', label: 'Text' } ] } ] },
    { title: 'Utilities vs. going solar (comparison)', fields: [
      { path: 'comparison.title', type: 'text', label: 'Heading' },
      { path: 'comparison.subtitle', type: 'text', label: 'Line under the heading' },
      { row: [ { path: 'comparison.col_utility', type: 'text', label: 'Left column name' }, { path: 'comparison.col_solar', type: 'text', label: 'Right column name' } ] } ],
      note: 'The rows of numbers are in the page code.' },
    { title: 'Photos of our work', anchor: '', fields: [ { path: 'gallery', type: 'images', label: 'Photos' } ] },
    { title: 'Equipment logos', fields: [ { path: 'manufacturers', type: 'images', logo: true, label: 'Logos', help: 'Scroll across the "Trusted equipment" strip. Transparent PNGs look best.' } ] },
    { title: 'About Dave', fields: [
      { path: 'home.about_text', type: 'para', label: 'About text', help: 'Leave a blank line between paragraphs.' },
      { path: 'home.referral_text', type: 'para', label: 'Referral program text' } ] },
    { title: 'FAQ', fields: [
      { path: 'faq', type: 'list', titleKey: 'question', addLabel: 'Add a question', blank: { question: '', answer: '' }, fields: [
        { key: 'question', type: 'text', label: 'Question' }, { key: 'answer', type: 'rich', label: 'Answer' } ] } ] }
  ]},
  { id: 'shared', group: 'Pages', label: 'Shared blocks', url: '/', intro: 'These show on more than one page.', sections: [
    { title: 'Rebate alert', where: 'Homepage + Quote page', fields: [
      { path: 'rebate_alert.heading', type: 'text', label: 'Heading' },
      { path: 'rebate_alert.text', type: 'rich', label: 'Text' },
      { path: 'rebate_alert.links', type: 'list', titleKey: 'label', addLabel: 'Add a link', blank: { label: '', url: '', external: false }, fields: [
        { row: [ { key: 'label', type: 'text', label: 'Link text' }, { key: 'url', type: 'url', label: 'Goes to', help: 'A page here (/quote/) or a full https:// address' } ] },
        { key: 'external', type: 'toggle', label: 'Opens another website (new tab)' } ] },
      { path: 'rebate_alert.quote_modal_text', type: 'para', label: 'Pop-up text on the Quote page' } ] },
    { title: 'Customer reviews', where: 'Homepage + Quote page', fields: [
      { row: [ { path: 'testimonials.rating', type: 'text', label: 'Star rating shown' }, { path: 'testimonials.total_reviews', type: 'text', label: 'Number of reviews shown' } ] },
      { path: 'testimonials.items', type: 'list', titleKey: 'name', subKey: 'role', addLabel: 'Add a review', blank: { name: '', role: '', initials: '', text: '' }, fields: [
        { row3: [ { key: 'name', type: 'text', label: 'Name' }, { key: 'role', type: 'text', label: 'Under the name', help: 'e.g. Carlsbad Homeowner' }, { key: 'initials', type: 'text', label: 'Initials (avatar)' } ] },
        { key: 'text', type: 'para', label: 'Review' } ] } ],
      note: 'Once Google Reviews is connected (Connections), the live rating and count replace the two numbers above.' }
  ]},
  { id: 'quote', group: 'Pages', label: 'Get a Quote', url: '/quote/', sections: [
    { title: 'Quote page', fields: [
      { path: 'quote.hero_eyebrow', type: 'text', label: 'Small label above the headline' },
      { path: 'quote.hero_title', type: 'text', label: 'Headline' },
      { path: 'quote.hero_subtitle', type: 'para', label: 'Line under the headline' },
      { path: 'quote.form_title', type: 'text', label: 'Question above the four choices', help: 'e.g. "What brings you here?"' },
      { path: 'quote.success_message', type: 'text', label: 'Heading after someone submits', help: 'The booking calendar appears right under it.' } ] }
  ]},
  { id: 'options', group: 'Pages', label: 'Energy Options', url: '/options/', file: 'options', sections: [
    { title: 'Top of the page', fields: [
      { path: 'hero.eyebrow', type: 'text', label: 'Small label' }, { path: 'hero.title', type: 'text', label: 'Headline' },
      { path: 'hero.sub', type: 'para', label: 'Line under the headline' }, { path: 'hero.cta', type: 'text', label: 'Button text' } ],
      note: 'Blank fields keep the text built into the page.' },
    { title: 'The option cards', anchor: 'options', fields: [
      { path: 'section.label', type: 'text', label: 'Small label above the cards' }, { path: 'section.heading', type: 'text', label: 'Heading above the cards' },
      { path: 'cards', type: 'list', titleKey: 'title', subKey: 'aka', addLabel: 'Add an option', blank: { number: '', title: '', aka: '', pros: [], tradeoffs: [], fit: '', bg_image: '' }, fields: [
        { row3: [ { key: 'number', type: 'text', label: 'Number (01)' }, { key: 'title', type: 'text', label: 'Name' }, { key: 'aka', type: 'text', label: 'Also called' } ] },
        { row: [ { key: 'pros', type: 'lines', label: 'Good things', help: 'One per line' }, { key: 'tradeoffs', type: 'lines', label: 'Trade-offs', help: 'One per line' } ] },
        { key: 'fit', type: 'para', label: 'Best fit if…', help: 'Finishes the sentence "This is a good fit if…"' },
        { key: 'bg_image', type: 'url', label: 'Background photo link' } ] } ],
      note: 'The side-by-side table and the 9 quiz questions are in the page code — ask Claude to change those.' },
    { title: 'Quiz intro', anchor: 'assessment', fields: [
      { path: 'form.label', type: 'text', label: 'Small label' }, { path: 'form.heading', type: 'text', label: 'Heading' }, { path: 'form.sub', type: 'para', label: 'Line under it' } ] },
    { title: 'Booking box & savings math', fields: [
      { path: 'cta.title', type: 'text', label: 'Heading' }, { path: 'cta.sub', type: 'para', label: 'Text' },
      { row: [ { path: 'cta.btn', type: 'text', label: 'Button text' }, { path: 'cta.calendly_url', type: 'url', label: 'Booking link', help: 'Must start with https://calendly.com/ — blank uses calendly.com/yourenergybest' } ] },
      { row: [ { path: 'calc.reduction', type: 'number', unit: '%', label: 'Assumed bill reduction' }, { path: 'calc.escalation', type: 'number', unit: '% / yr', label: 'Assumed utility rate increase' } ] } ] },
    { title: 'Page footer', fields: [ { path: 'footer.text', type: 'text', label: 'Footer line' }, { path: 'footer.disclaimer', type: 'para', label: 'Disclaimer' } ] }
  ]},
  { id: 'services', group: 'Pages', label: 'Services & Audit', url: '/services/', file: 'services', sections: [
    { title: 'Services page', fields: [
      { path: 'hero.title', type: 'text', label: 'Headline', help: 'Blank keeps "Solar Services".' },
      { path: 'hero.subtitle', type: 'para', label: 'Line under the headline' } ], prices: true }
  ]},
  { id: 'build', group: 'Pages', label: 'Build With Us', url: '/build/', sections: [
    { title: 'Top of the page', fields: [
      { path: 'build.hero.title', type: 'text', label: 'Headline' }, { path: 'build.hero.subtitle', type: 'para', label: 'Line under the headline' },
      { path: 'build.cta_text', type: 'text', label: 'Button text' } ] },
    { title: 'Why door-to-door', fields: [
      { path: 'build.section_title', type: 'text', label: 'Heading' }, { path: 'build.section_text', type: 'para', label: 'Text' },
      { path: 'build.benefits', type: 'list', titleKey: 'title', addLabel: 'Add a benefit', blank: { icon: '⭐', title: '', text: '' }, fields: [

  ]},
  { id: 'blog', group: 'Pages', label: 'Blog', url: '/blog.html', blog: true }

const FILES = { content: 'content', options: 'options', services: 'services' };
const PAGE_URL = 'https://yourenergybest.com';

/* ─── State ─── */
let CSRF = null;
const files = {};          // name → { data, snap }
let current = 'home';
const open = new Set();    // list items expanded (by path#index)

/* ─── Small helpers ─── */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
function setP(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach((k) => { if (a[k] == null || typeof a[k] !== 'object') a[k] = {}; a = a[k]; }); a[ks.at(-1)] = v; }
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(t._t); t._t = setTimeout(() => { t.className = 'toast'; }, 2600); }
function ask(title, text, buttons) {
  return new Promise((done) => {
    const m = h('div', { class: 'modal' }, h('div', { class: 'box' }, h('h4', {}, title), h('p', {}, text),
      h('div', { class: 'acts' }, buttons.map((b) => h('button', { class: 'btn ' + (b.cls || 'sec2'), type: 'button', onclick: () => { m.remove(); done(b.value); } }, b.label)))));
    document.body.append(m);
  });
}

/** Stored text may be old editor HTML ("<p>…</p>") or have "—" saved as letters. Show it as plain text. */
function toPlain(v) {
  if (v == null) return '';
  let s = String(v).replace(/\\u([0-9a-fA-F]{4})/g, (_, x) => String.fromCharCode(parseInt(x, 16)));
  if (!/<[a-z/][^>]*>|&[a-z#0-9]+;/i.test(s)) return s;
  s = s.replace(/<\/p>\s*<p[^>]*>/gi, '\n\n').replace(/<br\s*\/?>/gi, '\n').replace(/<li[^>]*>/gi, '• ').replace(/<\/li>/gi, '\n');
  const d = document.createElement('div'); d.innerHTML = s;
  return d.textContent.replace(/\n{3,}/g, '\n\n').trim();
}
/** Rich text: keep only simple formatting and safe links. */
function cleanRich(html) {
  const ok = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'A', 'UL', 'OL', 'LI', 'H3', 'H4']);
  const d = document.createElement('div'); d.innerHTML = html;
  (function walk(n) {
    for (const el of [...n.children]) {
      if (!ok.has(el.tagName)) { if (/^(SCRIPT|STYLE|IFRAME)$/.test(el.tagName)) el.remove(); else { el.replaceWith(...el.childNodes); } continue; }
      for (const a of [...el.attributes]) if (!(el.tagName === 'A' && a.name === 'href')) el.removeAttribute(a.name);
      if (el.tagName === 'A' && !/^(https?:|mailto:|tel:|\/)/i.test(el.getAttribute('href') || '')) el.removeAttribute('href');
      walk(el);
    }
  })(d);
  d.querySelectorAll('div').forEach((x) => x.replaceWith(...x.childNodes));
  return d.innerHTML.replace(/<p><br><\/p>/g, '').trim();
}
const imgSrc = (u) => !u ? '' : /^(https?:)?\/\//.test(u) || u.startsWith('/') ? u : '/' + u;

/* ─── Session ─── */
async function api(url, opts = {}) {
  const r = await fetch(url, opts);
  if (r.status === 403) { showLogin('Your session ended — sign in again. Your unpublished edits are kept.'); throw new Error('signed out'); }
  return r;
}
function showLogin(msg) { $('#login').classList.remove('hidden'); $('#loginErr').textContent = msg || ''; setTimeout(() => $('#loginEmail').focus(), 50); }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…'; $('#loginErr').textContent = '';
  try {
    const r = await fetch('/admin-auth.php?action=login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('#loginEmail').value.trim(), password: $('#loginPass').value }) });
    const j = await r.json();
    if (!j.success) { $('#loginErr').textContent = j.error || 'Sign-in failed.'; return; }
    CSRF = j.csrf_token; $('#loginPass').value = ''; $('#login').classList.add('hidden');
    if (!files.content) await loadAll();
  } catch (err) { $('#loginErr').textContent = 'Could not reach the server.'; }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});
$('#logoutBtn').addEventListener('click', async () => {
  if (isDirty() && await ask('Sign out with unpublished changes?', 'They will be lost.', [{ label: 'Stay', value: false }, { label: 'Sign out', value: true, cls: 'danger' }]) !== true) return;
  try { await fetch('/admin-auth.php?action=logout', { method: 'POST' }); } catch (e) {}
  location.reload();
});

/* ─── Load / publish ─── */
async function fetchFile(name) { const r = await api('/load-content.php?target=' + name + '&t=' + Date.now()); return r.json(); }
async function loadAll() {
  for (const name of Object.keys(FILES)) { const data = await fetchFile(name); files[name] = { data, snap: JSON.stringify(data) }; }
  const fromHash = location.hash.slice(1);
  if (PAGES.some((p) => p.id === fromHash) || ['connections', 'history'].includes(fromHash)) current = fromHash;
  renderNav(); render(); updateBar();
}
const dirtyFiles = () => Object.keys(files).filter((n) => JSON.stringify(files[n].data) !== files[n].snap);
const isDirty = () => dirtyFiles().length > 0;
function updateBar() {
  const d = dirtyFiles();
  $('#bar').classList.toggle('dirty', d.length > 0);
  $('#publishBtn').disabled = d.length === 0;
  $('#discardBtn').classList.toggle('hidden', d.length === 0);
  $('#status').innerHTML = d.length ? '<span class="dot"></span><b>Unpublished changes</b> — visitors still see the old version.'
    : '<span class="dot"></span>Everything is published' + (files._savedAt ? ' · last publish ' + files._savedAt : '') + '.';
}
async function publish() {
  const d = dirtyFiles(); if (!d.length) return;
  const btn = $('#publishBtn'); btn.disabled = true; btn.textContent = 'Publishing…';
  try {
    for (const name of d) {
      // Someone (another tab, device, or the classic editor) published since this was opened?
      const live = await fetchFile(name);
      if (JSON.stringify(live) !== files[name].snap) {
        const what = { content: 'Homepage / Quote / Build / Blog content', options: 'Energy Options page', services: 'Services page' }[name];
        const go = await ask('This changed somewhere else', `The ${what} was published from another tab or device after you opened the editor. Publishing now replaces those changes with yours.`,
          [{ label: 'Cancel', value: false }, { label: 'Publish mine anyway', value: true, cls: 'danger' }]);
        if (!go) { btn.textContent = 'Publish'; updateBar(); return; }
      }
      const r = await api('/save.php', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ ...files[name].data, _save_target: name }) });
      const j = await r.json();
      if (!j.success) throw new Error(j.error || 'Save failed');
      files[name].snap = JSON.stringify(files[name].data);
    }
    files._savedAt = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    toast('Published — it\'s live now.');
  } catch (e) { if (e.message !== 'signed out') toast('Not published: ' + e.message, true); }
  btn.textContent = 'Publish'; updateBar();
}
$('#publishBtn').addEventListener('click', publish);
$('#discardBtn').addEventListener('click', async () => {
  if (await ask('Discard your changes?', 'Everything goes back to what\'s live now.', [{ label: 'Keep editing', value: false }, { label: 'Discard', value: true, cls: 'danger' }]) !== true) return;
  for (const n of Object.keys(FILES)) files[n].data = JSON.parse(files[n].snap);
  render(); updateBar();
});
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); publish(); } });
window.addEventListener('beforeunload', (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
const changed = () => updateBar();

/* ─── Navigation ─── */
function renderNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  let grp = null;
  const items = [...PAGES, { id: 'connections', group: 'Settings', label: 'Connections' }, { id: 'history', group: 'Settings', label: 'History' }];
  for (const p of items) {
    if (p.group !== grp) { grp = p.group; nav.append(h('div', { class: 'grp' }, grp)); }
    nav.append(h('button', { type: 'button', class: p.id === current ? 'on' : '', onclick: () => { current = p.id; history.replaceState(null, '', '#' + p.id); renderNav(); render(); window.scrollTo(0, 0); } }, p.label));
  }
}
function render() {
  const main = $('#main'); main.innerHTML = '';
  if (current === 'connections') return renderConnections(main);
  if (current === 'history') return renderHistory(main);
  const page = PAGES.find((p) => p.id === current);
  const file = page.file || 'content';
  main.append(h('div', { class: 'page-head' }, h('h2', {}, page.label), h('a', { href: page.url, target: '_blank', rel: 'noopener' }, 'Open this page ↗')));
  if (page.intro) main.append(h('p', { class: 'intro' }, page.intro));
  if (page.blog) return renderBlog(main);
  for (const sec of page.sections) {
    const view = page.url + (sec.anchor ? '#' + sec.anchor : '');
    const bd = h('div', { class: 'bd' });
    if (sec.note) bd.append(h('p', { class: 'note' }, sec.note));
    for (const f of sec.fields) bd.append(field(file, f, files[file].data, ''));
    if (sec.prices) bd.append(pricesBox());
    main.append(h('section', { class: 'sec' },
      h('div', { class: 'hd' }, h('h3', {}, sec.title), sec.where ? h('span', { class: 'where' }, 'Shows on: ' + sec.where) : null,
        h('a', { class: 'view', href: view, target: '_blank', rel: 'noopener' }, 'See it ↗')), bd));
  }
}

/* ─── Fields ─── */
function field(file, f, obj, base) {
  if (f.row || f.row3) return h('div', { class: 'row' + (f.row3 ? ' r3' : '') }, (f.row || f.row3).map((x) => field(file, x, obj, base)));
  const path = f.path || f.key;
  const id = 'f' + Math.random().toString(36).slice(2, 9);
  const wrap = h('div', { class: 'f' });
  if (f.type !== 'toggle' && f.type !== 'list' && f.type !== 'images') wrap.append(h('label', { for: id }, f.label));
  else if (f.type !== 'toggle') wrap.append(h('label', {}, f.label || ''));
  if (f.help) wrap.append(h('div', { class: 'help' }, f.help));
  const val = getP(obj, path);
  const set = (v) => { setP(obj, path, v); changed(); };

  switch (f.type) {
    case 'text': case 'url': case 'date': {
      const el = h('input', { id, type: f.type === 'date' ? 'date' : f.type === 'url' ? 'url' : 'text', value: f.type === 'text' ? toPlain(val) : (val || '') });
      el.addEventListener('input', () => set(el.value));
      wrap.append(el); break;
    }
    case 'number': {
      const el = h('input', { id, type: 'number', step: 'any', value: val ?? '' });
      el.addEventListener('input', () => set(el.value === '' ? '' : Number(el.value)));
      wrap.append(f.unit ? h('div', { class: 'unit' }, el, h('span', {}, f.unit)) : el); break;
    }
    case 'para': {
      const el = h('textarea', { id, rows: 3 }); el.value = toPlain(val);
      const grow = () => { el.style.height = 'auto'; el.style.height = Math.min(600, el.scrollHeight + 2) + 'px'; };
      el.addEventListener('input', () => { set(el.value); grow(); });
      wrap.append(el); requestAnimationFrame(grow); break;
    }
    case 'lines': {
      const el = h('textarea', { id, rows: 4 }); el.value = (Array.isArray(val) ? val : []).map(toPlain).join('\n');
      el.addEventListener('input', () => set(el.value.split('\n').map((s) => s.trim()).filter(Boolean)));
      wrap.append(el); break;
    }
    case 'toggle': {
      const el = h('input', { id, type: 'checkbox' }); el.checked = !!val;
      el.addEventListener('change', () => set(el.checked));
      wrap.append(h('label', { class: 'toggle', for: id }, el, f.label)); break;
    }
    case 'rich': wrap.append(richEditor(val, (html) => set(html), f.tall)); break;
    case 'images': wrap.append(imageList(obj, path, !!f.logo)); break;
    case 'list': wrap.append(listEditor(file, obj, path, f)); break;
  }
  return wrap;
}

function richEditor(val, onChange, tall) {
  const area = h('div', { class: 'area', contenteditable: 'true' });
  area.innerHTML = cleanRich(String(val || '').replace(/\\u([0-9a-fA-F]{4})/g, (_, x) => String.fromCharCode(parseInt(x, 16))));
  if (!area.innerHTML.trim()) area.innerHTML = '<p><br></p>';
  const cmd = (c, v) => { area.focus(); document.execCommand(c, false, v); emit(); };
  const emit = () => onChange(cleanRich(area.innerHTML));
  area.addEventListener('input', emit);
  area.addEventListener('paste', (e) => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
  const tb = h('div', { class: 'tb' },
    h('button', { type: 'button', title: 'Bold', onmousedown: (e) => e.preventDefault(), onclick: () => cmd('bold') }, h('b', {}, 'B')),
    h('button', { type: 'button', title: 'Italic', onmousedown: (e) => e.preventDefault(), onclick: () => cmd('italic') }, h('i', {}, 'I')),
    h('button', { type: 'button', title: 'Bulleted list', onmousedown: (e) => e.preventDefault(), onclick: () => cmd('insertUnorderedList') }, '• List'),
    h('button', { type: 'button', title: 'Link', onmousedown: (e) => e.preventDefault(), onclick: () => {
      const u = prompt('Link to (a page like /quote/ or a full https:// address):'); if (u) cmd('createLink', u.trim()); } }, '🔗 Link'),
    h('button', { type: 'button', title: 'Remove formatting', onmousedown: (e) => e.preventDefault(), onclick: () => { cmd('removeFormat'); cmd('unlink'); } }, 'Clear'));
  return h('div', { class: 'rich' + (tall ? ' tall' : '') }, tb, area);
}

function listEditor(file, obj, path, f) {
  if (!Array.isArray(getP(obj, path))) setP(obj, path, []);
  const box = h('div');
  const draw = () => {
    const arr = getP(obj, path); box.innerHTML = '';
    const items = h('div', { class: 'items' });
    arr.forEach((it, i) => {
      const key = file + ':' + path + '#' + i;
      const title = toPlain(it[f.titleKey]) || '(untitled)';
      const sub = f.subKey ? toPlain(it[f.subKey]) : '';
      const move = (d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; open.delete(key); changed(); draw(); };
      const head = h('div', { class: 'ih', onclick: (e) => { if (e.target.closest('button')) return; open.has(key) ? open.delete(key) : open.add(key); draw(); } },
        h('span', { class: 't' }, (open.has(key) ? '▾ ' : '▸ ') + title, sub ? h('small', {}, sub) : null),
        f.fixed ? null : h('button', { class: 'ibtn', type: 'button', title: 'Move up', onclick: () => move(-1) }, '↑'),
        f.fixed ? null : h('button', { class: 'ibtn', type: 'button', title: 'Move down', onclick: () => move(1) }, '↓'),
        f.fixed ? null : h('button', { class: 'ibtn del', type: 'button', title: 'Remove', onclick: async () => {
          if (await ask('Remove "' + title + '"?', 'It disappears from the site when you publish.', [{ label: 'Keep it', value: false }, { label: 'Remove', value: true, cls: 'danger' }]) !== true) return;
          arr.splice(i, 1); open.clear(); changed(); draw(); } }, '✕'));
      const body = h('div', { class: 'ib' });
      if (open.has(key)) for (const sf of f.fields) body.append(field(file, sf, it, ''));
      // keep the header title current while typing
      body.addEventListener('input', () => { head.querySelector('.t').firstChild.textContent = '▾ ' + (toPlain(it[f.titleKey]) || '(untitled)'); });
      items.append(h('div', { class: 'item' + (open.has(key) ? ' open' : '') }, head, body));
    });
    box.append(items);
    if (!f.fixed) box.append(h('button', { class: 'add', type: 'button', onclick: () => {
      arr.push(JSON.parse(JSON.stringify(f.blank || {}))); open.add(file + ':' + path + '#' + (arr.length - 1)); changed(); draw(); } }, '+ ' + (f.addLabel || 'Add')));
  };
  draw();
  return box;
}

function imageList(obj, path, logo) {
  if (!Array.isArray(getP(obj, path))) setP(obj, path, []);
  const box = h('div');
  const draw = () => {
    const arr = getP(obj, path); box.innerHTML = '';
    const grid = h('div', { class: 'imgs' });
    arr.forEach((it, i) => {
      const cap = h('input', { type: 'text', placeholder: logo ? 'Brand name' : 'Caption', value: toPlain(logo ? (it.name || it.caption) : (it.caption || it.name)) });
      cap.addEventListener('input', () => { if (logo) it.name = cap.value; else it.caption = cap.value; changed(); });
      const move = (d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; changed(); draw(); };
      grid.append(h('div', { class: 'img' }, h('div', { class: 'ph' + (logo ? ' logo' : ''), style: `background-image:url("${imgSrc(it.url).replace(/"/g, '%22')}")` }), cap,
        h('div', { class: 'ctl' },
          h('button', { class: 'ibtn', type: 'button', onclick: () => move(-1) }, '←'), h('button', { class: 'ibtn', type: 'button', onclick: () => move(1) }, '→'),
          h('button', { class: 'ibtn del', type: 'button', onclick: async () => {
            if (await ask('Remove this image?', 'It disappears from the site when you publish.', [{ label: 'Keep', value: false }, { label: 'Remove', value: true, cls: 'danger' }]) !== true) return;
            arr.splice(i, 1); changed(); draw(); } }, '✕'))));
    });
    const input = h('input', { type: 'file', accept: 'image/*', multiple: true });
    const label = h('label', { class: 'add upload' }, input, '+ Upload images');
    input.addEventListener('change', async () => {
      const list = [...input.files]; input.value = '';
      for (let k = 0; k < list.length; k++) {
        label.lastChild.textContent = ` Uploading ${k + 1} of ${list.length}…`;
        const fd = new FormData(); fd.append('image', list[k]); fd.append('_csrf_token', CSRF);
        try {
          const r = await api('/upload-image.php', { method: 'POST', body: fd });
          const j = await r.json();
          if (!j.success) { toast(list[k].name + ': ' + (j.error || 'upload failed'), true); continue; }
          const nm = list[k].name.replace(/\.[^.]+$/, '');
          arr.push({ url: j.url, caption: nm, name: nm }); changed();
        } catch (e) { break; }
      }
      draw();
    });
    box.append(grid, label);
  };
  draw();
  return box;
}

function pricesBox() {
  const box = h('div', { class: 'note' }, 'Loading prices…');
  fetch('/plans.php').then((r) => r.json()).then((p) => {
    box.innerHTML = '';
    box.append(h('div', {}, h('b', {}, 'Prices'), ' — these come from plans.php (the same list Stripe charges from), so the pages and checkout always match. To change one, ask Claude or edit plans.php.'));
    const ul = h('ul', { style: 'margin:6px 0 0 1.1rem;padding:0' });
    for (const k in p) ul.append(h('li', {}, `${p[k].name}: $${p[k].price}${p[k].recurring ? '/year' : ''}`));
    box.append(ul);
  }).catch(() => { box.textContent = 'Prices come from plans.php.'; });
  return box;
}

/* ─── Blog ─── */
function renderBlog(main) {
  const c = files.content.data;
  if (!Array.isArray(c.blog_posts)) c.blog_posts = [];
  const posts = c.blog_posts;
  main.append(h('p', { class: 'intro' }, 'Posts appear on the blog, newest first. With "Also post to lumaria" on, members see it in the app under Beacons → "From the Admiral".'));
  main.append(h('button', { class: 'add', type: 'button', style: 'margin-bottom:14px', onclick: () => {
    posts.unshift({ id: 'b' + Date.now().toString(36), title: '', tag: '', date: new Date().toISOString().slice(0, 10), readtime: '3 min read', body: '', beacon: true });
    open.add('blog:' + posts[0].id); changed(); render(); } }, '+ New post'));
  if (!posts.length) main.append(h('div', { class: 'sec' }, h('div', { class: 'bd' }, h('p', { style: 'margin:0;color:var(--soft)' }, 'No posts yet — the blog shows "Coming soon" until the first one is published.'))));
  const order = [...posts].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  for (const p of order) {
    const key = 'blog:' + (p.id || p.title);
    const isOpen = open.has(key);
    const live = JSON.parse(files.content.snap).blog_posts || [];
    const published = p.id && live.some((x) => x.id === p.id);
    const hd = h('div', { class: 'hd', style: 'cursor:pointer', onclick: (e) => { if (e.target.closest('a,button')) return; isOpen ? open.delete(key) : open.add(key); render(); } },
      h('h3', {}, (isOpen ? '▾ ' : '▸ ') + (toPlain(p.title) || '(untitled post)')),
      h('span', { class: 'where' }, (p.date || '') + (p.beacon === false ? '' : ' · also in lumaria')),
      published ? h('a', { class: 'view', href: '/blog.html?p=' + encodeURIComponent(p.id), target: '_blank', rel: 'noopener' }, 'See it ↗') : h('span', { class: 'where' }, 'not published yet'));
    const bd = h('div', { class: 'bd' + (isOpen ? '' : ' hidden') });
    if (isOpen) {
      if (!p.id) { p.id = 'b' + Date.now().toString(36); }
      bd.append(
        field('content', { path: 'title', type: 'text', label: 'Title' }, p),
        field('content', { row3: [ { path: 'tag', type: 'text', label: 'Topic tag', help: 'e.g. Batteries, Rates, Repairs' }, { path: 'date', type: 'date', label: 'Date' }, { path: 'readtime', type: 'text', label: 'Read time' } ] }, p),
        field('content', { path: 'body', type: 'rich', tall: true, label: 'Post' }, p),
        h('div', { class: 'f' }, (() => { const cb = h('input', { type: 'checkbox' }); cb.checked = p.beacon !== false;
          cb.addEventListener('change', () => { p.beacon = cb.checked; changed(); });
          return h('label', { class: 'toggle' }, cb, 'Also post to lumaria (Beacons → From the Admiral)'); })()),
        h('button', { class: 'btn danger', type: 'button', onclick: async () => {
          if (await ask('Delete this post?', 'It comes off the blog and out of lumaria when you publish.', [{ label: 'Keep it', value: false }, { label: 'Delete', value: true, cls: 'danger' }]) !== true) return;
          posts.splice(posts.indexOf(p), 1); changed(); render(); } }, 'Delete post'));
    }
    main.append(h('section', { class: 'sec' }, hd, bd));
  }
}

/* ─── History (backups.php) ─── */
async function renderHistory(main) {
  main.append(h('div', { class: 'page-head' }, h('h2', {}, 'History')));
  main.append(h('p', { class: 'intro' }, 'Every publish keeps the version before it (the last 10 of each). Restoring puts that version live — and keeps today\'s, so you can undo the restore too.'));
  const box = h('div'); main.append(box); box.textContent = 'Loading…';
  try {
    const list = await (await api('/backups.php')).json();
    box.innerHTML = '';
    const names = { content: 'Homepage, Quote, Build, Blog & shared blocks', options: 'Energy Options page', services: 'Services page' };
    for (const k of ['content', 'options', 'services']) {
      const t = h('table', { class: 'hist' });
      if (!list[k].length) t.append(h('tr', {}, h('td', {}, 'No earlier versions yet.')));
      for (const b of list[k]) {
        const when = new Date(b.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        t.append(h('tr', {}, h('td', {}, when), h('td', {},
          h('a', { href: '/backups.php?file=' + encodeURIComponent(b.file), target: '_blank', rel: 'noopener', style: 'margin-right:12px' }, 'View'),
          h('button', { class: 'ibtn', type: 'button', onclick: () => restore(b, when) }, 'Restore'))));
      }
      box.append(h('section', { class: 'sec' }, h('div', { class: 'hd' }, h('h3', {}, names[k])), h('div', { class: 'bd' }, t)));
    }
  } catch (e) { if (e.message !== 'signed out') box.textContent = 'Could not load history.'; }
}
async function restore(b, when) {
  if (isDirty()) { toast('Publish or discard your current changes first.', true); return; }
  if (await ask('Restore the version from ' + when + '?', 'It goes live right away. What\'s live now is kept in History.', [{ label: 'Cancel', value: false }, { label: 'Restore', value: true, cls: 'danger' }]) !== true) return;
  const r = await api('/backups.php', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF }, body: JSON.stringify({ action: 'restore', file: b.file }) });
  const j = await r.json();
  if (!j.ok) return toast(j.error || 'Restore failed', true);
  const data = await fetchFile(j.restored); files[j.restored] = { data, snap: JSON.stringify(data) };
  toast('Restored — live now.'); render(); updateBar();
}

/* ─── Connections (connections.php) ─── */
function renderConnections(main) {
  main.append(h('div', { class: 'page-head' }, h('h2', {}, 'Connections'), h('button', { class: 'btn sec2', type: 'button', onclick: () => render() }, '↻ Re-check')));
  main.append(h('p', { class: 'intro' }, 'What the site talks to. Tokens you paste are checked with the service first, then saved on the server — never shown again, never in GitHub, and not downloadable.'));
  const stray = h('div', { class: 'note warn hidden' }); main.append(stray);
  const card = (key, title, how, inputs, action, btnLabel) => {
    const pill = h('span', { class: 'pill', id: 'pill-' + key }, 'Checking…');
    const msg = h('span', { class: 'msg' });
    const save = h('button', { class: 'btn pri', type: 'button', onclick: async () => {
      const data = {}; for (const i of inputs) data[i.name] = i.el.value.trim();
      msg.style.color = 'var(--soft)'; msg.textContent = 'Checking…';
      try {
        const r = await api('/connections.php', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF }, body: JSON.stringify({ action, ...data }) });
        const j = await r.json();
        msg.style.color = j.ok ? 'var(--green)' : 'var(--red)';
        msg.textContent = j.ok ? '✓ Saved' + (j.account ? ' — ' + j.account : '') + (j.reviews ? ` · ${j.rating}★, ${j.reviews} reviews` : '') : (j.error || 'Failed');
        if (j.ok) { inputs.forEach((i) => { i.el.value = ''; }); loadStatus(); }
      } catch (e) {}
    } }, btnLabel);
    main.append(h('section', { class: 'sec' }, h('div', { class: 'hd' }, h('h3', {}, title), pill),
      h('div', { class: 'bd' }, h('details', { class: 'how' }, h('summary', {}, 'How to get it'), h('ol', { class: 'steps', html: how })),
        ...inputs.map((i) => h('div', { class: 'f' }, i.el)), h('div', {}, save, msg))));
  };
  const inp = (name, ph, secret = true) => ({ name, el: h('input', { type: secret ? 'password' : 'text', placeholder: ph, autocomplete: 'off', style: 'width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px' }) });
  card('instagram', '📸 Instagram (homepage feed)',
    '<li><b>Cut off the old token first:</b> in the Instagram app → Settings → <i>Apps and websites</i> → remove your website\'s app.</li><li>Open <a href="https://developers.facebook.com/apps/" target="_blank" rel="noopener">developers.facebook.com/apps</a> → your app → <i>Instagram</i> → <i>API setup with Instagram login</i>.</li><li>Under <i>Generate access tokens</i>, connect <b>@energy.best.ca</b> → <i>Generate token</i>.</li><li>Paste it below. It lasts 60 days and the site renews it by itself.</li>',
    [inp('token', 'Instagram access token')], 'instagram', 'Check & save');
  card('zoho', '📇 Zoho CRM (leads, install map)',
    '<li>Open <a href="https://api-console.zoho.com/" target="_blank" rel="noopener">api-console.zoho.com</a> → the client the website uses (usually <i>Self Client</i>).</li><li><i>Generate Code</i> tab → Scope <code>ZohoCRM.modules.ALL,ZohoCRM.coql.READ</code> · 10 minutes · <i>Create</i>.</li><li>Paste the code below within 10 minutes (each works once).</li>',
    [inp('code', 'Grant code (1000.…)')], 'zoho', 'Connect');
  card('stripe', '💳 Stripe (payments → Zoho)',
    '<li><a href="https://dashboard.stripe.com/webhooks" target="_blank" rel="noopener">Stripe → Developers → Webhooks</a> → <i>Add endpoint</i>.</li><li>URL: <code>https://yourenergybest.com/stripe-webhook.php</code></li><li>Events: <code>checkout.session.completed</code>, <code>checkout.session.async_payment_succeeded</code>, <code>invoice.paid</code>, <code>invoice.payment_failed</code>, <code>customer.subscription.deleted</code>.</li><li>Reveal the signing secret (<code>whsec_…</code>) and paste it below, then <i>Send test event</i> in Stripe.</li>',
    [inp('secret', 'whsec_…')], 'stripe_webhook', 'Save signing secret');
  card('google', '⭐ Google Reviews (homepage rating)',
    '<li>In <a href="https://console.cloud.google.com/apis/library/places.googleapis.com" target="_blank" rel="noopener">Google Cloud</a>, enable <i>Places API (New)</i>.</li><li><i>Credentials → Create credentials → API key</i>, restricted to Places API (New).</li><li>Find your Place ID with the <a href="https://developers.google.com/maps/documentation/places/web-service/place-id" target="_blank" rel="noopener">Place ID Finder</a>.</li>',
    [inp('key', 'API key'), inp('place_id', 'Place ID (ChIJ…)', false)], 'google', 'Check & save');

  async function loadStatus() {
    try {
      const s = await (await api('/connections.php')).json();
      const set = (k, cls, text) => { const p = $('#pill-' + k); if (p) { p.className = 'pill ' + cls; p.textContent = text; } };
      const ig = s.instagram;
      set('instagram', !ig.configured ? 'bad' : ig.ok ? 'ok' : 'bad', !ig.configured ? 'Not connected' : ig.ok ? `Working · @${ig.account} · saved ${ig.saved_days_ago}d ago` : 'Broken — ' + (ig.error || 'token rejected'));
      const z = s.zoho;
      set('zoho', !z.client_configured || !z.configured || !z.ok ? 'bad' : 'ok', !z.client_configured ? 'Client ID/secret missing in config.php' : !z.configured ? 'Not connected' : z.ok ? 'Working' : 'Broken — reconnect');
      const st = s.stripe;
      set('stripe', !st.secret_key || !st.ok ? 'bad' : st.webhook_secret ? 'ok' : 'warn', !st.secret_key ? 'No secret key in config.php' : !st.ok ? 'Stripe rejected the key'
        : (st.live ? 'Live' : 'TEST mode') + (st.account ? ' · ' + st.account : '') + (st.webhook_secret ? ' · webhook on' : ' · webhook not set up'));
      set('google', s.google.configured ? 'ok' : 'warn', s.google.configured ? 'Connected' : 'Not connected — showing fixed numbers');
      if (s.stray_files && s.stray_files.length) {
        stray.classList.remove('hidden'); stray.innerHTML = '';
        stray.append('Leftovers on the server that git cannot remove: ' + s.stray_files.join(', ') + ' ',
          h('button', { class: 'ibtn del', type: 'button', onclick: async () => {
            const r = await api('/connections.php', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF }, body: JSON.stringify({ action: 'cleanup' }) });
            const j = await r.json(); toast(j.ok ? 'Deleted: ' + (j.deleted.join(', ') || 'nothing') : 'Cleanup failed', !j.ok); loadStatus(); } }, 'Delete them'));
      } else stray.classList.add('hidden');
    } catch (e) {}
  }
  loadStatus();
}

/* ─── Start ─── */
(async () => {
  try {
    const r = await fetch('/admin-auth.php?action=check');
    const j = await r.json();
    if (j.authenticated) { CSRF = j.csrf_token; $('#login').classList.add('hidden'); await loadAll(); }
    else showLogin();
  } catch (e) { showLogin('Could not reach the server.'); }
})();
</script>
